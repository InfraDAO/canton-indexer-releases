# my-balance — "how much of each token do we hold, right now?"
#
# One line per unlocked CIP-56 Holding owned by our DevNet party. Naming the
# `splice-api-token-holding-v1` interface rather than `Splice.Amulet:Amulet`
# gets the standard's normalized payload, so this works for every
# token-standard instrument (docs/data-model.md, "My balance"). Locked
# holdings exist but cannot be spent, hence `lock == null`.
#
# Replace the party id with the one your own validator hosts.
#
# The balance is the consumer's GROUP BY; v1 does not aggregate:
#   select owner, instrument, sum(amount) from <table>
#   where _archived_at_offset is null group by 1,2;
# Amulet holdings decay with holding fees, so that sum is an upper bound
# without the current open round (Scan data).

name = "my_balance"
source = "lifecycle"
version = 1
where = '.template_fqn == "splice-api-token-holding-v1:Splice.Api.Token.HoldingV1:Holding" and .payload_type == "interface" and .payload.owner == "infradao-devnet-1::12205b62a09e83b520e0a18097871eaaae3dac33069109965f2e217f679661e1d0c1" and .payload.lock == null'

[select]
owner = 'party(.payload.owner)'
instrument = '.payload.instrumentId.id'
admin = 'party(.payload.instrumentId.admin)'
amount = 'decimal(.payload.amount)'
